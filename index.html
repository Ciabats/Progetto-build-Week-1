<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App - Epicode</title>
  <link rel="icon" href="assets/images.jpg">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="headerWelcome">
    <img src="assets/epicode-logo.png" alt="Epicode Logo" class="brand-logo" />
  </header>

  <main id="app">
    <section id="welcome-screen">
      <div id="Intro">
        <h1>Benvenuti al milionario</h1>
        <p class="Paragrafo">
          Una serie di 10 domande sul mondo dell'informatica e del web.
        </p>
      </div>

      <ul class="regole-list">
        <li>Ogni domanda ha <strong>30 secondi</strong> di tempo</li>
        <li>Una volta cliccata una risposta, non puoi cambiarla</li>
        <li>Il Quiz dura circa 5 minuti</li>
      </ul>

      <div class="container-bottone">
        <button type="button" id="btn-start" class="BottoneInvio">Inizia</button>
      </div>
    </section>

  
  </main>
  <footer></footer>

  <script src="script.js"></script>
</body>

</html>
